# This is a basic workflow to help you get started with Actions

name: Sonarscan DotNet

# Controls when the action will run.
on:
  # Analyze master after merge. Feature branches are analyzed by the pull_request
  # trigger below so an update to an open PR does not start duplicate scans.
  # feature/cpu-cycle-engine is a long-lived integration branch that gets master's checks.
  push:
    branches: [ master, feature/cpu-cycle-engine ]
    paths-ignore:
      - 'docs/**'
      - 'includes/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - README.md

  pull_request:
    branches: [ master, feature/cpu-cycle-engine ]
    paths-ignore:
      - 'docs/**'
      - 'includes/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - README.md
    
  schedule:
    - cron: '10 1 * * 0'    

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: CI / Sonar scan
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: '0'

      # Runs a single command using the runners shell
      - name: SonarScanner for .NET 10 with pull request decoration support
        uses: highbyte/sonarscan-dotnet@8642efb8793ae4a89bd1e6cdf0a1aef1e582f9bb # v2.5.1
        with:
          # The key of the SonarQube project
          sonarProjectKey: highbyte_dotnet-6502
          # The name of the SonarQube project
          sonarProjectName:  dotnet-6502
          # The name of the SonarQube organization in SonarCloud. For hosted SonarQube, skip this setting.
          sonarOrganization: highbyte
          # The scanner container bundles an older SDK. Install the global.json SDK
          # inside that container; a host setup-dotnet step cannot update its SDK.
          # SHA-512 is from Microsoft's .NET 10 release metadata for linux-x64.
          dotnetPreBuildCmd: >-
            curl --fail --location --retry 3
            https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.401/dotnet-sdk-10.0.401-linux-x64.tar.gz
            --output /tmp/dotnet-sdk.tar.gz
            && echo '51c8b999af9e8dd9998c9edc5944e19a90788862068acd38694e098889054ce8c23d4f0c5cccfa16bf187d044562359e5ee69a9f8ad0bbe913ba90311fbce25b  /tmp/dotnet-sdk.tar.gz' | sha512sum --check --status
            && tar --extract --gzip --file /tmp/dotnet-sdk.tar.gz --directory /usr/share/dotnet
          # Optional command arguments to 'dotnet build'
          dotnetBuildArguments: ./tests/Highbyte.DotNet6502.Tests
          # Optional command arguments to dotnet test
          dotnetTestArguments: ./tests/Highbyte.DotNet6502.Tests --filter TestType!=Integration --logger trx --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          # Optional extra command arguments the the SonarScanner 'begin' command
          # Coverage is measured only for the core CPU emulator library Highbyte.DotNet6502.
          # The inclusion filter is exact-name: sibling dirs Highbyte.DotNet6502.Impl.*
          # and Highbyte.DotNet6502.Systems are NOT matched (different directory names).
          # sonar.cpd.exclusions: the Cloudflare Worker tools under tools/** are standalone
          # TypeScript deployables (not the .NET product) and intentionally share small helper
          # functions (path normalization, bearer-token auth). Exclude them from copy/paste
          # duplication detection so that shared boilerplate doesn't fail the new-code gate.
          #
          # sonar.coverage.exclusions: same scope decision, applied to coverage. This gate measures
          # the .NET product - sonar.coverage.inclusions already narrows it to one library - and no
          # coverage report is produced for the TypeScript under tools/**, so without this their
          # lines count as uncovered and drag new_coverage to 0. The Workers do have their own
          # vitest suites, run by their own workflows; they are simply not reported here. If that
          # ever changes, drop this and feed the lcov in instead.
          sonarBeginArguments: /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" -d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx" -d:sonar.coverage.inclusions="src/libraries/Highbyte.DotNet6502/**/*.*" -d:sonar.cpd.exclusions="tools/**" -d:sonar.coverage.exclusions="tools/**"
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
