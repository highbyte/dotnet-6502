# ld65 linker config for Apple II DOS 3.3 "B" (binary) files.
#
# Emits the 4-byte B-file header (load address + length, little endian) followed by the
# code, the same layout BLOAD/BRUN expect and the layout the emulator's
# "Load & start binary" uses. Override the load address with:
#   ld65 -C apple2-b.cfg --start-addr 0x4000 ...
FEATURES {
    STARTADDRESS: default = $2000;
}
MEMORY {
    HEADER: file = %O, start = $0000, size = $0004;
    MAIN:   file = %O, define = yes, start = %S, size = $BF00 - %S;
}
SEGMENTS {
    EXEHDR: load = HEADER, type = ro;
    CODE:   load = MAIN,   type = ro;
    RODATA: load = MAIN,   type = ro, optional = yes;
    DATA:   load = MAIN,   type = rw, optional = yes;
    BSS:    load = MAIN,   type = bss, optional = yes;
}
